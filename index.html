            color: #4da6ff;
            margin-bottom: 20px;
            border-bottom: 1px solid #3a3a4a;
            padding-bottom: 15px;
        }
        .header-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            color: #888;
            margin-bottom: 15px;
        }
        .question {
            font-size: 1.2em;
            margin-bottom: 20px;
            font-weight: 600;
            line-height: 1.4;
        }
        .option {
            background-color: #313142;
            border: 1px solid #4a4a5a;
            color: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
            display: block;
            width: 100%;
            text-align: left;
            font-size: 1.1em;
            line-height: 1.3;
        }
        .option:hover:not(:disabled) {
            background-color: #4da6ff;
            border-color: #4da6ff;
            color: #1a1a24;
            font-weight: bold;
        }
        .option:disabled {
            cursor: not-allowed;
        }
        .correct {
            background-color: #4CAF50 !important;
            border-color: #4CAF50 !important;
            color: white !important;
            font-weight: bold;
        }
        .wrong {
            background-color: #F44336 !important;
            border-color: #F44336 !important;
            color: white !important;
            font-weight: bold;
        }
        .action-btn {
            background-color: #4da6ff;
            color: #1a1a24;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
        }
        .action-btn:hover {
            background-color: #3388dd !important;
        }
        #quiz-screen, #score-screen {
            display: none;
        }
        #next-btn {
            display: none;
        }
        .menu-desc {
            text-align: center;
            margin-bottom: 30px;
            color: #ccc;

<!-- MAIN MENU SCREEN -->
<div class="quiz-container" id="menu-screen">

<!-- QUIZ SCREEN -->

    <div class="question" id="question">Loading question...</div>
    <div id="options"></div>
    <button class="option action-btn" id="next-btn" onclick="nextQuestion()">Next Question</button>

<!-- SCORE SCREEN -->

            options: ["Gauss-Jordan Method", "LU Decomposition", "Choleski's Method", "Crout's Method"],
            answer: "Gauss-Jordan Method"
        },
        {
            question: "46. LU Decomposition factors a coefficient matrix into which two matrices?",
            options: ["A Left matrix and an Upper matrix", "A Lower Triangular matrix and an Upper Triangular matrix", "A Linear matrix and an Undefined matrix", "A Lower matrix and an Unknown vector"],
            answer: "A Lower Triangular matrix and an Upper Triangular matrix"
        },
        {
            question: "47. Which of the following is NOT a method used to solve LU Decomposition?",
            options: ["Gauss Elimination", "Crout's Method", "Choleski's Method", "Gauss-Jordan Method"],
            answer: "Gauss-Jordan Method"
        },
        {
            question: "48. In the context of MATLAB operations, what is the result of rem(13,5)?",
            options: ["2", "2.6", "3", "1"],
            answer: "3"
        },
        {
            question: "49. What type of robot works strictly in three linear directions (up/down, left/right, front/back)?",
            options: ["Cylindrical Robot", "Rectilinear / Cartesian Robot", "Fully Articulated Robot", "Spherical Robot"],
            answer: "Rectilinear / Cartesian Robot"
        },
        {
            question: "50. What is a highly flexible robot with multiple joints commonly used in welding and painting?",
            options: ["Spherical Robot", "Fully Articulated Robot", "Cylindrical Robot", "Rectilinear Robot"],
            answer: "Fully Articulated Robot"
        }
    ];

    // STATE VARIABLES
    let activeData = [];
    let currentQuestion = 0;
    let score = 0;

    // DOM ELEMENTS
    const menuScreen = document.getElementById('menu-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const scoreScreen = document.getElementById('score-screen');
    const quizTitle = document.getElementById('quiz-title');
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const progressEl = document.getElementById('progress');
    const realTimeScoreEl = document.getElementById('real-time-score');
    const nextBtn = document.getElementById('next-btn');

    // LOGIC
    function startQuiz(quizID) {
        if (quizID === 'U0') {
            activeData = quizU0;
            quizTitle.innerText = "U0: History of Robotics Quiz";
        } else if (quizID === 'U1') {
            activeData = quizU1;
            quizTitle.innerText = "U1: Intro to Robotics & Concepts Quiz";
        }

        currentQuestion = 0;
        score = 0;
        
        menuScreen.style.display = 'none';
        quizScreen.style.display = 'block';
        
        loadQuestion();
    }

    function loadQuestion() {
        nextBtn.style.display = 'none';
        optionsEl.innerHTML = '';
        
        const currentQuizData = activeData[currentQuestion];
        progressEl.innerText = `Question ${currentQuestion + 1} of ${activeData.length}`;
        realTimeScoreEl.innerText = `Score: ${score}`;
        questionEl.innerText = currentQuizData.question;

        currentQuizData.options.forEach(option => {
            const button = document.createElement('button');
            button.innerText = option;
            button.classList.add('option');
            button.onclick = (e) => selectAnswer(option, e.target);
            optionsEl.appendChild(button);
        });
    }

    function selectAnswer(selected, buttonElement) {
        const currentQuizData = activeData[currentQuestion];
        const allButtons = optionsEl.children;
        
        for (let btn of allButtons) {
            btn.disabled = true;
        }

        if (selected === currentQuizData.answer) {
            buttonElement.classList.add('correct');
            score++;
            realTimeScoreEl.innerText = `Score: ${score}`;
        } else {
            buttonElement.classList.add('wrong');
            for (let btn of allButtons) {
                if (btn.innerText === currentQuizData.answer) {
                    btn.classList.add('correct');
                }
            }
        }

        nextBtn.style.display = 'block';
        if (currentQuestion === activeData.length - 1) {
            nextBtn.innerText = "Finish Quiz";
        } else {
            nextBtn.innerText = "Next Question";
        }
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < activeData.length) {
            loadQuestion();
        } else {
            showScore();
        }
    }

    function showScore() {
        quizScreen.style.display = 'none';
        scoreScreen.style.display = 'block';
        document.getElementById('score').innerText = score;
        document.getElementById('total').innerText = activeData.length;
    }

    function returnToMenu() {
        scoreScreen.style.display = 'none';
        menuScreen.style.display = 'block';
    }
</script>

</body>
</html>
