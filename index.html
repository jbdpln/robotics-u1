<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotics Quizzes</title>
    <style>
        body {
            background-color: #1a1a24;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .quiz-container {
            background-color: #242430;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 700px;
        }
        h2 {
            text-align: center;
            color: #4da6ff;
            margin-bottom: 20px;
            border-bottom: 1px solid #3a3a4a;
            padding-bottom: 15px;
        }
        /* PROGRESS BAR STYLES */
        .progress-bar-container {
            width: 100%;
            background-color: #313142;
            height: 6px;
            border-radius: 3px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background-color: #4CAF50;
            width: 0%;
            transition: width 0.4s ease;
        }
        .header-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            color: #888;
            margin-bottom: 15px;
        }
        .question {
            font-size: 1.2em;
            margin-bottom: 20px;
            font-weight: 600;
            line-height: 1.4;
        }
        .option {
            background-color: #313142;
            border: 1px solid #4a4a5a;
            color: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
            display: block;
            width: 100%;
            text-align: left;
            font-size: 1.1em;
            line-height: 1.3;
        }
        .option:hover:not(:disabled) {
            background-color: #4da6ff;
            border-color: #4da6ff;
            color: #1a1a24;
            font-weight: bold;
        }
        .option:disabled {
            cursor: not-allowed;
        }
        .correct {
            background-color: #1c3d26 !important; /* Darker green background */
            border-color: #4CAF50 !important;
            color: white !important;
            font-weight: bold;
        }
        .wrong {
            background-color: #3d1c1c !important; /* Darker red background */
            border-color: #F44336 !important;
            color: white !important;
            font-weight: bold;
        }
        /* FEEDBACK / TRIVIA BOX STYLES */
        .feedback-box {
            display: none;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
            border-left: 5px solid;
            background-color: #1e293b;
        }
        .feedback-box.correct-feedback {
            border-left-color: #4CAF50;
        }
        .feedback-box.wrong-feedback {
            border-left-color: #F44336;
        }
        .feedback-title {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
        }
        .feedback-correct-title { color: #4CAF50; }
        .feedback-wrong-title { color: #F44336; }
        .feedback-text {
            color: #e2e8f0;
            font-size: 0.95em;
            line-height: 1.4;
        }
        
        .action-btn {
            background-color: #4CAF50;
            color: #ffffff;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
            border-color: #4CAF50;
        }
        .action-btn:hover {
            background-color: #45a049 !important;
            border-color: #45a049 !important;
        }
        .menu-btn {
            background-color: #4da6ff;
        }
        .menu-btn:hover {
            background-color: #3388dd !important;
        }
        #quiz-screen, #score-screen { display: none; }
        #next-btn { display: none; }
        .menu-desc { text-align: center; margin-bottom: 30px; color: #ccc; }

</head>
<body>

<!-- MAIN MENU SCREEN -->
<div class="quiz-container" id="menu-screen">
    <h2>Robotics Reviewer Quizzes</h2>
    <p class="menu-desc">Select a module to begin testing your knowledge.</p>
    <button class="option action-btn menu-btn" onclick="startQuiz('U0')">U0: History of Robotics</button>

</div>

<!-- QUIZ SCREEN -->
<div class="quiz-container" id="quiz-screen">
    <h2 id="quiz-title">Quiz</h2>
    
    <!-- PROGRESS BAR -->
    <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar"></div>
    </div>

    <div class="header-info">
        <span id="progress">Question 1 of X</span>
        <span id="real-time-score">Score: 0</span>
    </div>
    
    <div class="question" id="question">Loading question...</div>
    <div id="options"></div>

    <!-- TRIVIA / FEEDBACK BOX -->
    <div class="feedback-box" id="feedback-box">
        <div class="feedback-title" id="feedback-title"></div>
        <div class="feedback-text" id="feedback-text"></div>
    </div>

    <button class="option action-btn" id="next-btn" onclick="nextQuestion()">Next Question</button>
</div>

<!-- SCORE SCREEN -->
<div class="quiz-container" id="score-screen">

    // STATE VARIABLES
    let activeData = [];
    let currentQuestion = 0;
    let score = 0;

    // DOM ELEMENTS
    const menuScreen = document.getElementById('menu-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const scoreScreen = document.getElementById('score-screen');
    const quizTitle = document.getElementById('quiz-title');
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const progressEl = document.getElementById('progress');
    const realTimeScoreEl = document.getElementById('real-time-score');
    const nextBtn = document.getElementById('next-btn');
    const progressBar = document.getElementById('progress-bar');
    const feedbackBox = document.getElementById('feedback-box');
    const feedbackTitle = document.getElementById('feedback-title');
    const feedbackText = document.getElementById('feedback-text');

    // Fisher-Yates Shuffle Function
    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    // LOGIC
    function startQuiz(quizID) {
        let selectedQuiz = [];
        
        if (quizID === 'U0') {
            selectedQuiz = quizU0;
            quizTitle.innerText = "U0: History of Robotics Quiz";
        } else if (quizID === 'U1') {
            selectedQuiz = quizU1;
            quizTitle.innerText = "U1: Intro to Robotics & Concepts Quiz";
        } else if (quizID === 'U2') {
            selectedQuiz = quizU2;
            quizTitle.innerText = "U2: Robot Sensors Quiz";
        } else if (quizID === 'U3') {
            selectedQuiz = quizU3;
            quizTitle.innerText = "U3: Robot Grippers & Programming Quiz";
        }

        activeData = shuffleArray(selectedQuiz);
        currentQuestion = 0;
        score = 0;
        
        menuScreen.style.display = 'none';
        quizScreen.style.display = 'block';
        
        loadQuestion();
    }

    function loadQuestion() {
        nextBtn.style.display = 'none';
        feedbackBox.style.display = 'none';
        optionsEl.innerHTML = '';
        
        const currentQuizData = activeData[currentQuestion];
        progressEl.innerText = `Question ${currentQuestion + 1} of ${activeData.length}`;
        realTimeScoreEl.innerText = `Score: ${score}`;
        questionEl.innerText = currentQuizData.question;

        // Update progress bar width based on current question
        const progressPercent = (currentQuestion / activeData.length) * 100;
        progressBar.style.width = `${progressPercent}%`;

        // Shuffle options for the current question so they aren't always in the same order
        const randomizedOptions = shuffleArray(currentQuizData.options);

        randomizedOptions.forEach(option => {
            const button = document.createElement('button');
            button.innerText = option;
            button.classList.add('option');
            button.onclick = (e) => selectAnswer(option, e.target);
            optionsEl.appendChild(button);
        });
    }

    function selectAnswer(selected, buttonElement) {
        const currentQuizData = activeData[currentQuestion];
        const allButtons = optionsEl.children;
        
        // Disable buttons after clicking
        for (let btn of allButtons) {
            btn.disabled = true;
        }

        // Check Answer & Show Feedback Box
        if (selected === currentQuizData.answer) {
            buttonElement.classList.add('correct');
            score++;
            realTimeScoreEl.innerText = `Score: ${score}`;
            
            feedbackBox.className = 'feedback-box correct-feedback';
            feedbackTitle.innerHTML = '✔ Correct!';
            feedbackTitle.className = 'feedback-title feedback-correct-title';
            feedbackText.innerHTML = `Great job! The answer is exactly <strong>"${currentQuizData.answer}"</strong>.`;
        } else {
            buttonElement.classList.add('wrong');
            for (let btn of allButtons) {
                if (btn.innerText === currentQuizData.answer) {
                    btn.classList.add('correct');
                }
            }
            
            feedbackBox.className = 'feedback-box wrong-feedback';
            feedbackTitle.innerHTML = '✖ Incorrect';
            feedbackTitle.className = 'feedback-title feedback-wrong-title';
            feedbackText.innerHTML = `The correct answer was: <strong>"${currentQuizData.answer}"</strong>.`;
        }

        feedbackBox.style.display = 'block';

        // Fill progress bar for the completed question
        const progressPercent = ((currentQuestion + 1) / activeData.length) * 100;
        progressBar.style.width = `${progressPercent}%`;

        nextBtn.style.display = 'block';
        if (currentQuestion === activeData.length - 1) {
            nextBtn.innerText = "Finish Quiz";
        } else {
            nextBtn.innerText = "Next Question";
        }
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < activeData.length) {
            loadQuestion();
        } else {
            showScore();
        }
    }

    function showScore() {
        quizScreen.style.display = 'none';
        scoreScreen.style.display = 'block';
        document.getElementById('score').innerText = score;
        document.getElementById('total').innerText = activeData.length;
    }

    function returnToMenu() {
        scoreScreen.style.display = 'none';
        menuScreen.style.display = 'block';
    }
</script>
